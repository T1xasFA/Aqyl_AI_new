      const escapeHtml = (str) => String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

      const normalizeText = (value) => String(value || "")
        .toLowerCase()
        .replace(/[ё]/g, "е")
        .replace(/[\s\_\-–—()²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉]/g, "")
        .replace(/[і]/g, "i")
        .replace(/[қ]/g, "к")
        .replace(/[ғ]/g, "г")
        .replace(/[ү]/g, "у")
        .replace(/[ұ]/g, "у")
        .replace(/[ө]/g, "о")
        .replace(/[ә]/g, "а")
        .replace(/[ң]/g, "н")
        .replace(/[һ]/g, "х");

      const normalizeAnswer = (value) => String(value || "")
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/,/g, ".")
        .replace(/√/g, "sqrt")
        .replace(/−/g, "-")
        .replace(/;/g, ",");

      function renderLatexOrText(value, displayMode = false) {
        const text = String(value ?? "").trim();
        if (!text) return "";
        const pureFormula = /\|\^|_|\{|\}|\frac|\sqrt|\log|\int|\sin|\cos|\tan/.test(text) || /^[0-9xya-zA-Z+\-*/=().,^\s]+$/.test(text);
        if (window.katex && pureFormula) {
          try {
            return katex.renderToString(text, { throwOnError: false, displayMode });
          } catch (e) {}
        }
        return escapeHtml(text);
      }

      function renderMixedMath(value) {
        const text = String(value ?? "");
        const parts = text.split(/(\$[^$]+\$)/g).filter(Boolean);
        if (parts.length > 1) {
          return parts.map((part) => {
            if (part.startsWith("$") && part.endsWith("$")) return renderLatexOrText(part.slice(1, -1), false);
            return escapeHtml(part);
          }).join("");
        }
        return renderLatexOrText(text, false);
      }

      function MathText({ value, display = false, className = "" }) {
        return <span className={className} dangerouslySetInnerHTML={{ __html: display ? renderLatexOrText(value, true) : renderMixedMath(value) }} />;

      function findTheoryByTitle(grade, topicTitle) {
        const list = THEORY_BANK[grade] || THEORY_BANK[String(grade)] || [];
        const target = normalizeText(topicTitle);
        return list.find((item) => normalizeText(item.title) === target)
          || list.find((item) => normalizeText(item.title).includes(target) || target.includes(normalizeText(item.title)))
          || null;
      }

      function getTheoryForSkill(skill) {
        if (!skill) return null;
        return findTheoryByTitle(skill.grade, skill.title) || null;

        if (!skill) return null;

        const hard = topic.hard || [];
        return { easy, medium, hard, all: [...easy, ...medium, ...hard] };

            unit: `${grade}-сынып · Бөлім ${unitIndex + 1}`,
            about: chunk.map((topic) => topic.title).join(" · "),
            skills: chunk.map((topic, topicIndex) => ({
              id: `${grade}-${topic.key}`,
              grade,
              topicKey: topic.key,
              type: topicIndex === 0 && unitIndex === 0 ? "practice" : (topicIndex % 3 === 0 ? "video" : topicIndex % 3 === 1 ? "practice" : "test"),
              title: topic.title,
              status: unitIndex === 0 && topicIndex === 0 ? "active" : "not",
              taskCount: [...(topic.easy || []), ...(topic.medium || []), ...(topic.hard || [])].length,
            })),
          }));
        });
        return result;
      }

      function LessonWorkspace({ skill, onComplete, completed }) {
        const allowedTabs = ['theory', 'example', 'practice', 'summary'];
        const getInitialTab = () => {
          const saved = localStorage.getItem(`aqylai_lesson_tab_${skill?.id || 'default'}`) || 'theory';
          return allowedTabs.includes(saved) ? saved : 'theory';
        };

        const [tab, setTab] = useState(getInitialTab);
        const [difficulty, setDifficulty] = useState('easy');
        const [taskIndex, setTaskIndex] = useState(0);
        const [answer, setAnswer] = useState('');
        const [checked, setChecked] = useState(null);
        const [hintOpen, setHintOpen] = useState(false);
        const [showSolution, setShowSolution] = useState(false);
        const [solutionText, setSolutionText] = useState('');
        const [aiAnalysis, setAiAnalysis] = useState('');
        const [aiLoading, setAiLoading] = useState(false);
        const [aiError, setAiError] = useState('');
        const [bookmarked, setBookmarked] = useState(false);
        const [noteText, setNoteText] = useState('');
        const [historyVersion, setHistoryVersion] = useState(0);

        useEffect(() => {
          const saved = localStorage.getItem(`aqylai_lesson_tab_${skill?.id || 'default'}`) || 'theory';
          setTab(allowedTabs.includes(saved) ? saved : 'theory');
          setDifficulty('easy');
          setTaskIndex(0);
          setAnswer('');
          setChecked(null);
          setHintOpen(false);
          setShowSolution(false);
          setSolutionText('');
          setAiAnalysis('');
          setAiError('');
          setAiLoading(false);
        }, [skill?.id]);

        useEffect(() => {
          if (!skill?.id) return;
          setBookmarked(getBookmarks().some(b => b.id === skill.id));
          setNoteText(getNote(skill.id));
        }, [skill?.id]);

        useEffect(() => {
          if (skill?.id) localStorage.setItem(`aqylai_lesson_tab_${skill.id}`, tab);
        }, [skill?.id, tab]);

        const content = getLessonContent(skill);
        const tasksByDifficulty = content.tasks;
        const activeTasks = tasksByDifficulty[difficulty] || [];
        const currentTask = activeTasks[taskIndex] || content.tasks.all[0] || null;
        const totalTasks = content.tasks.all.length;
        const historyKey = `aqylai_answer_history_${skill?.id}`;
        const history = useMemo(() => loadJSON(historyKey, []), [historyKey, historyVersion, skill?.id]);
        const uniqueCorrect = useMemo(() => new Set(history.filter(item => item?.correct).map(item => item.id)), [history]);
        const wrongAttempts = useMemo(() => history.filter(item => item && item.correct === false), [history]);
        const masteryTarget = Math.min(6, Math.max(3, totalTasks || 3));
        const masteryPercent = Math.min(100, Math.round((uniqueCorrect.size / masteryTarget) * 100));
        const currentTaskHistory = history.filter(item => item.id === currentTask?.id);
        const currentTaskSolved = currentTaskHistory.some(item => item.correct);
        const currentTaskWrong = currentTaskHistory.some(item => item.correct === false);
        const recommendedDifficulty = masteryPercent >= 70 ? 'hard' : masteryPercent >= 35 ? 'medium' : 'easy';
        const difficultyLabel = { easy: 'Бастапқы', medium: 'Орта', hard: 'Күрделі' };
        const tabs = [
          ['theory', 'Теория'],
          ['example', 'Мысал'],
          ['practice', 'Жаттығу'],
          ['summary', 'Қорытынды'],
        ];

        const formulaSections = (content.sections || []).filter(section => section.type === 'interactive_formula');
        const rememberSections = (content.sections || []).filter(section => section.type === 'remember');
        const compactTheorySections = (content.sections || []).filter(section => section.type !== 'example_steps');

        const toggleBookmark = () => {
          if (!skill?.id) return;
          const list = getBookmarks();
          const exists = list.some(b => b.id === skill.id);
          const next = exists
            ? list.filter(b => b.id !== skill.id)
            : [...list, { id: skill.id, grade: skill.grade, title: skill.title, unit: skill.unit || '', topicKey: skill.topicKey, savedAt: new Date().toISOString() }];
          setBookmarks(next);
          setBookmarked(!exists);
        };

        const saveCurrentNote = () => {
          if (skill?.id) setNote(skill.id, noteText);
        };

        const recordAttempt = (ok) => {
          if (!currentTask) return;
          const nextHistory = history.filter((item) => !(item.id === currentTask.id && item.answer === answer));
          nextHistory.push({
            id: currentTask.id,
            q: currentTask.q,
            expected: currentTask.a,
            difficulty,
            answer,
            correct: ok,
            at: new Date().toISOString(),
          });
          saveJSON(historyKey, nextHistory.slice(-60));
          setHistoryVersion((v) => v + 1);
          const nextCorrect = new Set(nextHistory.filter(item => item?.correct).map(item => item.id));
          if (ok && (nextCorrect.size >= masteryTarget || difficulty === 'hard')) onComplete(skill?.id);
        };

        const getAiApiUrl = () => {
          const local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
          return local ? 'http://127.0.0.1:8000/api/ai' : 'https://backend-umur.onrender.com/api/ai';
        };

        const localSolutionReview = (mode = 'analyze') => {
          const steps = solutionText.split(/\n+/).map(s => s.trim()).filter(Boolean);
          const finalOk = currentTask ? normalizeAnswer(answer) === normalizeAnswer(currentTask.a) : false;
          if (!solutionText.trim()) {
            return 'Шешу жолы бос. AI талдау үшін кемінде 2–3 қадам жазыңыз: қандай формула қолдандыңыз, қалай ықшамдадыңыз, соңында қандай жауап шықты.';
          }
          if (steps.length < 2 && solutionText.trim().length < 45) {
            return 'Шешу жолы өте қысқа. Толық талдау үшін әр қадамды бөлек жазыңыз. Мысалы:\n1) Формуланы анықтадым...\n2) Орнына қойдым...\n3) Ықшамдадым...';
          }
          if (mode === 'hint') {
            return `Қысқа hint: алдымен осы тақырыптағы негізгі формуланы тексеріңіз. Содан кейін соңғы түрлендіруде таңба, дәреже немесе бөлім өзгермегенін салыстырыңыз.`;
          }
          if (mode === 'mistake') {
            return finalOk
              ? 'Соңғы жауап дұрыс көрінеді. Енді шешу жолындағы әр қадамда қолданылған формула мен арифметикалық түрлендіруді тексеріңіз. Егер бәрі негізделсе, шешім қабылданады.'
              : `Соңғы жауап күтілетін жауаппен сәйкес емес. Бірінші тексеретін жер: формуланы дұрыс таңдадыңыз ба және соңғы ықшамдау кезінде таңба/бөлім өзгерген жоқ па. Күтілетін жауап: ${currentTask?.a || '—'}.`;
          }
          return finalOk
            ? `Талдау:\n✓ Қорытынды жауап дұрыс көрінеді.\n✓ Шешу жолыңызда бірнеше қадам бар, бұл жақсы.\nКелесі жақсарту: әр қадамға қысқа негіздеме қосыңыз — қандай формула қолданылды және неге солай түрлендірілді.`
            : `Талдау:\n• Шешу жолыңыз қабылданды, бірақ соңғы жауап сәйкес емес.\n• Қайта қарау керек: формула таңдауы, таңба, дәреже немесе бөлшекті қысқарту.\nКелесі қадам: соңғы екі түрлендіруді қайта есептеп, жауабыңызды ${currentTask?.a || 'күтілетін жауаппен'} салыстырыңыз.`;
        };

        const analyzeStudentSolution = async (mode = 'analyze') => {
          if (!currentTask) return;
          if (!solutionText.trim() && !answer.trim()) {
            setAiError('Алдымен шешу жолыңызды немесе жауабыңызды жазыңыз.');
            return;
          }
          setAiLoading(true);
          setAiError('');
          setAiAnalysis('');

          const modeText = {
            analyze: 'Оқушының толық шешу жолын талда. Дайын шешімді бірден берме. Алғашқы қате қадамды, дұрыс тұсын және келесі қысқа қадамды көрсет.',
            hint: 'Оқушыға тек қысқа hint бер. Соңғы жауапты ашпа.',
            mistake: 'Оқушының шешу жолындағы бірінші ықтимал қатені тап және қысқа түсіндір.',
            model: 'Оқушы сұрағандықтан, қысқа үлгі шешімді қадамдап көрсет.',
          }[mode] || 'Оқушының шешу жолын талда.';

          try {
            const resp = await fetch(getAiApiUrl(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                taskText: currentTask.q,
                expectedAnswer: currentTask.a,
                userAnswer: answer,
                solutionText,
                userMessage: modeText,
                lang: 'kk',
              }),
            });
            if (!resp.ok) throw new Error(`AI API ${resp.status}`);
            const data = await resp.json();
            const reply = data?.reply || data?.text || data?.analysis || localSolutionReview(mode);
            setAiAnalysis(reply);
          } catch (e) {
            setAiAnalysis(localSolutionReview(mode));
            setAiError('Backend AI уақытша қолжетімсіз. Төменде жергілікті қысқа талдау көрсетілді.');
          } finally {
            setAiLoading(false);
          }
        };

        const handleCheck = () => {
          if (!currentTask) return;
          const ok = normalizeAnswer(answer) === normalizeAnswer(currentTask.a);
          setChecked(ok);
          setShowSolution(false);
          recordAttempt(ok);
        };

        const resetPracticeState = () => {
          setChecked(null);
          setAnswer('');
          setHintOpen(false);
          setShowSolution(false);
          setSolutionText('');
          setAiAnalysis('');
          setAiError('');
        };

        const nextTask = () => {
          resetPracticeState();
          if (taskIndex < activeTasks.length - 1) setTaskIndex(taskIndex + 1);
          else setTaskIndex(0);
        };

        const prevTask = () => {
          resetPracticeState();
          if (taskIndex > 0) setTaskIndex(taskIndex - 1);
          else setTaskIndex(Math.max(0, activeTasks.length - 1));
        };

        const chooseDifficulty = (key) => {
          setDifficulty(key);
          setTaskIndex(0);
          resetPracticeState();
        };

        const openPractice = () => {
          setDifficulty(recommendedDifficulty);
          setTab('practice');

        const StatusBadge = ({ children, tone = 'neutral' }) => {

            amber: 'bg-[#fff5d8] border-[#f3dfaa] text-[#8a5b00]',
            red: 'bg-red-50 border-red-200 text-red-800',

            .lesson-v10 .academy-panel { background: white; border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 1px 0 #e9edf2, 0 14px 34px rgba(19,36,58,.045); }
            .lesson-v10 .lesson-head { border: 1px solid var(--line); background: linear-gradient(180deg,#ffffff,#f7faf8); border-radius: 28px; box-shadow: 0 16px 40px rgba(19,36,58,.055); }
            .lesson-v10 .lesson-tab { border: 1px solid var(--line); color: var(--muted); background: white; }
            .lesson-v10 .lesson-tab.active { background: var(--sage); border-color: var(--sage); color: white; box-shadow: 0 4px 0 #23694b; }
            .lesson-v10 .micro-card { border: 1px solid var(--line); background: #fff; border-radius: 22px; }
            .lesson-v10 .step-line { position: relative; padding-left: 34px; }
            .lesson-v10 .step-line::before { content: ''; position: absolute; left: 13px; top: 30px; bottom: -14px; width: 2px; background: #dde7e0; }
            .lesson-v10 .step-line:last-child::before { display: none; }
            .lesson-v10 .step-dot { position: absolute; left: 0; top: 2px; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: var(--sage-soft); color: var(--sage-dark); font-size: 13px; font-weight: 1000; border: 1px solid #b9ddcc; }
            .lesson-v10 .formula-pill { border: 1px solid #cfe8dc; background: var(--sage-soft); border-radius: 18px; padding: 12px 14px; font-weight: 900; }
            .lesson-v10 .task-status-dot { width: 11px; height: 11px; border-radius: 999px; display: inline-block; background: #cbd3dc; }
            .lesson-v10 .task-status-dot.done { background: var(--sage); box-shadow: 0 0 0 4px var(--sage-soft); }
            .lesson-v10 .task-status-dot.wrong { background: var(--red); box-shadow: 0 0 0 4px #ffe7e4; }
            .lesson-v10 .ai-check-card { border:1px solid #d8e4ee; background:linear-gradient(180deg,#fbfdff,#f3f8fb); border-radius:24px; }
            .lesson-v10 .ai-check-output { white-space:pre-wrap; line-height:1.7; }
            .lesson-v10 details summary { cursor: pointer; list-style: none; }
            .lesson-v10 details summary::-webkit-details-marker { display: none; }
          `}</style>

          <div className="lesson-head p-5 lg:p-6 mb-5">
            <div className="flex items-start justify-between gap-4 mb-5">
              <div>
                <div className="text-sm font-black text-[var(--muted)] mb-2">{skill?.unit || 'Бөлім'}</div>
                <h1 className="text-3xl lg:text-4xl font-black tracking-[-.04em] leading-tight">{skill?.title || 'Сабақ'}</h1>
              </div>
              {completed?.[skill?.id] && <StatusBadge tone="green">Аяқталды</StatusBadge>}
            </div>

            <div className="flex flex-wrap items-center justify-between gap-4">
              <div className="flex flex-wrap gap-2">
                {tabs.map(([key, label]) => <button key={key} onClick={() => setTab(key)} className={`lesson-tab btn-rise px-4 py-3 rounded-xl font-black ${tab === key ? 'active' : 'hover:bg-[#f7faf8]'}`}>{label}</button>)}
              </div>
              <div className="min-w-[180px] sm:max-w-[220px] w-full sm:w-auto">
                <div className="flex items-center justify-between mb-2 text-sm font-black"><span>Прогресс</span><span className="text-[var(--sage)]">{masteryPercent}%</span></div>
                <div className="progress-track"><div style={{width:`${masteryPercent}%`}} /></div>
              </div>
            </div>
          </div>

          <main className="space-y-5">
            <div className="academy-panel overflow-hidden">
              {tab === 'theory' && <div className="p-5 lg:p-7 space-y-5">
                <div className="rounded-3xl border border-[#cfe8dc] bg-[#f4fbf7] p-5">
                  <div className="text-sm font-black uppercase tracking-wide text-[var(--sage)] mb-3">Қысқаша түсіндіру</div>
                  <p className="font-semibold text-[var(--muted)] leading-8"><MathText value={content.theoryText} /></p>
                </div>
                {formulaSections.length > 0 && <div className="grid gap-3 md:grid-cols-2">
                  {formulaSections.slice(0, 2).map((section, idx) => <div key={idx} className="formula-pill overflow-auto"><div className="text-xs font-black text-[var(--sage)] mb-2">{section.title}</div><MathText value={section.formula} display /></div>)}
                </div>}
                {compactTheorySections.map((section, idx) => <TheorySectionCard key={idx} section={section} />)}
                <div className="flex flex-wrap justify-end gap-3">
                  <button onClick={() => setTab('example')} className="btn-rise btn-secondary px-6 py-3">Мысал</button>
                  <button onClick={openPractice} className="btn-rise btn-primary px-6 py-3">Жаттығу</button>
                </div>
              </div>}

              {tab === 'example' && <div className="p-5 lg:p-7">
                <div className="rounded-[26px] border border-[#f3dfaa] bg-[#fff9eb] p-5 lg:p-6">
                  <div className="text-sm font-black uppercase tracking-wide text-[#9a6a00] mb-3">Қадамдық мысал</div>
                  <div className="mb-5 rounded-2xl bg-white border border-[var(--line)] p-5 font-black text-2xl overflow-auto"><MathText value={content.exampleTask} display /></div>
                  <div className="space-y-4">
                    {content.example.map((line, idx) => <div key={idx} className="step-line">
                      <div className="step-dot">{idx + 1}</div>
                      <div className="rounded-2xl bg-white border border-[var(--line)] p-4 font-semibold text-[var(--muted)] leading-7"><MathText value={line} /></div>
                    </div>)}
                  </div>
                  <div className="mt-5 rounded-2xl bg-white border border-[var(--line)] p-4 font-black text-[var(--ink)]">Жауап: <MathText value={content.exampleAnswer} /></div>
                </div>
                <div className="mt-5 flex flex-wrap justify-end gap-3">
                  <button onClick={() => setTab('theory')} className="btn-rise btn-secondary px-6 py-3">Теория</button>
                  <button onClick={openPractice} className="btn-rise btn-primary px-6 py-3">Жаттығуды бастау</button>
                </div>
              </div>}

              {tab === 'practice' && <div className="p-5 lg:p-7">

                  </div>
                  <div className="flex flex-wrap gap-2">
                    {['easy','medium','hard'].map((key) => <button key={key} onClick={() => chooseDifficulty(key)} className={`px-4 py-2 rounded-xl font-black border ${difficulty === key ? 'bg-[var(--ink)] text-white border-[var(--ink)]' : 'bg-white text-[var(--muted)] border-[var(--line)] hover:bg-[#f7faf8]'}`}>{difficultyLabel[key]}</button>)}
                  </div>
                </div>

                <div className="mb-5 flex flex-wrap gap-2">
                  {activeTasks.map((task, idx) => {
                    const solved = history.some(item => item.id === task.id && item.correct);
                    const wrong = history.some(item => item.id === task.id && item.correct === false);
                    return <button key={task.id} onClick={() => { setTaskIndex(idx); resetPracticeState(); }} className={`rounded-full border px-3 py-2 text-sm font-black ${taskIndex === idx ? 'border-[var(--ink)] bg-[var(--ink)] text-white' : 'border-[var(--line)] bg-white text-[var(--muted)]'}`}><span className={`task-status-dot mr-2 ${solved ? 'done' : wrong ? 'wrong' : ''}`} />{idx + 1}</button>;

                </div>

                {!currentTask ? <div className="rounded-2xl border border-[var(--line)] bg-[var(--paper-2)] p-6 font-bold text-[var(--muted)]">Бұл тақырыпқа тапсырма әлі қосылмаған.</div> : <div className="rounded-[28px] border border-[var(--line)] bg-white overflow-hidden">
                  <div className="p-5 border-b border-[var(--line)] bg-[var(--paper-2)] flex flex-wrap justify-between gap-3">
                    <div className="font-black text-[var(--muted)]">Тапсырма {taskIndex + 1}/{activeTasks.length}</div>

                      {currentTaskSolved && <StatusBadge tone="green">бұрын дұрыс</StatusBadge>}

                  <div className="p-5 lg:p-6">
                    <div className="rounded-3xl border border-[var(--line)] bg-[#fbfcfb] p-6 text-3xl font-black overflow-auto"><MathText value={currentTask.q} display /></div>
                    <input value={answer} onChange={(e) => { setAnswer(e.target.value); setChecked(null); setShowSolution(false); }} onKeyDown={(e) => { if (e.key === 'Enter') handleCheck(); }} placeholder="Жауабыңызды енгізіңіз" className="mt-5 w-full rounded-2xl border border-[var(--line)] px-5 py-4 text-lg font-bold outline-none focus:border-[var(--sage)] focus:ring-4 focus:ring-green-100" />

                    {hintOpen && <div className="mt-5 rounded-2xl p-5 bg-[var(--blue-soft)] text-[var(--ink)] border border-[#cbd9ff]"><div className="font-black mb-1">AI кеңес</div><div className="font-semibold leading-7">{content.hint}</div></div>}
                    {checked !== null && <div className={`mt-5 rounded-2xl p-5 border ${checked ? 'bg-green-50 text-green-800 border-green-200' : 'bg-red-50 text-red-800 border-red-200'}`}><div className="font-black mb-1">{checked ? 'Дұрыс. Жарайсыз.' : 'Қате. Қай қадамда тоқтағаныңызды анықтайық.'}</div><div className="font-semibold leading-7">{checked ? 'Бұл есеп меңгеру прогресіне қосылды.' : 'Қажет болса, кеңес немесе түсіндірме ашыңыз.'}</div></div>}
                    {showSolution && <div className="mt-5 rounded-2xl border border-[#f3dfaa] bg-[#fff9eb] p-5"><div className="font-black text-[#8a5b00] mb-2">Қысқа түсіндірме</div><div className="font-semibold text-[var(--muted)] leading-7">Алдымен формуланы анықтап, өрнекті ықшамдаңыз. Соңында жауапты күтілетін форматпен салыстырыңыз.</div><div className="mt-3 font-black">Күтілетін жауап: <MathText value={currentTask.a} /></div></div>}

                    <div className="ai-check-card mt-5 p-5">
                      <div className="flex flex-wrap items-start justify-between gap-3 mb-3">
                        <div>
                          <div className="text-lg font-black text-[var(--ink)]">Шешу жолын AI талдасын</div>
                          <div className="text-sm font-semibold text-[var(--muted)] mt-1">Оқушы тек жауап емес, толық шығару жолын жазады. AI қате қадамды тауып, келесі бағыт береді.</div>
                        </div>
                        <span className="rounded-full border border-[#cbd9ff] bg-[var(--blue-soft)] px-3 py-1 text-xs font-black text-[var(--blue)]">AI feedback</span>
                      </div>

                      <textarea
                        value={solutionText}
                        onChange={(e) => { setSolutionText(e.target.value); setAiError(''); }}
                        className="focus-ring w-full min-h-[130px] rounded-2xl border border-[var(--line)] bg-white p-4 font-semibold text-[var(--ink)] outline-none focus:border-[var(--blue)] focus:ring-4 focus:ring-blue-100"
                        placeholder={`Мысалы:
1) Формуланы жаздым...
2) Берілген мәндерді қойдым...
3) Ықшамдадым...
4) Жауап: ...`}
                      />

                      <div className="mt-3 flex flex-wrap gap-3">
                        <button disabled={aiLoading || (!solutionText.trim() && !answer.trim())} onClick={() => analyzeStudentSolution('analyze')} className="btn-rise btn-ink px-5 py-3 disabled:opacity-40">AI талдау</button>
                        <button disabled={aiLoading} onClick={() => analyzeStudentSolution('hint')} className="btn-rise btn-secondary px-5 py-3 disabled:opacity-40">Қысқа hint</button>
                        <button disabled={aiLoading} onClick={() => analyzeStudentSolution('mistake')} className="btn-rise btn-secondary px-5 py-3 disabled:opacity-40">Қате қай қадамда?</button>
                      </div>

                      {aiLoading && <div className="mt-4 rounded-2xl border border-[var(--line)] bg-white p-4 font-semibold text-[var(--muted)]">AI шешу жолын оқып жатыр…</div>}
                      {aiError && <div className="mt-4 rounded-2xl border border-[#f3dfaa] bg-[#fff9eb] p-4 text-sm font-semibold text-[#8a5b00]">{aiError}</div>}
                      {aiAnalysis && <div className="ai-check-output mt-4 rounded-2xl border border-[var(--line)] bg-white p-5 font-semibold text-[var(--ink)]">{aiAnalysis}</div>}
                    </div>

                    <div className="mt-6 flex flex-wrap gap-3 justify-between">
                      <div className="flex flex-wrap gap-3">
                        <button onClick={() => setHintOpen(true)} className="font-black text-[var(--blue)]">Формула hint</button>
                        {!checked && <button onClick={() => setShowSolution(true)} className="font-black text-[#9a6a00]">Түсіндірме</button>}
                      </div>
                      <div className="flex flex-wrap gap-3">
                        <button onClick={prevTask} className="btn-rise btn-secondary px-5 py-3">Алдыңғы</button>
                        <button onClick={nextTask} className="btn-rise btn-secondary px-5 py-3">Келесі</button>
                        <button disabled={!answer.trim()} onClick={handleCheck} className="btn-rise btn-ink px-7 py-3 disabled:opacity-40">Тексеру</button>
                      </div>
                    </div>
                  </div>
                </div>}
              </div>}

              {tab === 'summary' && <div className="p-5 lg:p-7 space-y-5">
                <div className="grid md:grid-cols-3 gap-4">
                  {[[`${masteryPercent}%`, 'меңгеру'], [`${uniqueCorrect.size}/${masteryTarget}`, 'дұрыс есеп'], [`${wrongAttempts.length}`, 'қайта қарау']].map(([value, label]) => <div key={label} className="micro-card p-5 text-center"><div className="text-3xl font-black text-[var(--sage)]">{value}</div><div className="text-sm font-black text-[var(--muted)] mt-1">{label}</div></div>)}
                </div>
                <div className="micro-card p-6">
                  <h2 className="text-2xl font-black mb-4">Сабақты аяқтау</h2>
                  <p className="font-semibold text-[var(--muted)] leading-7 mb-5">Кемінде бірнеше тапсырма дұрыс болса, сабақ аяқталды деп белгілеуге болады.</p>
                  <button onClick={() => { saveCurrentNote(); if (uniqueCorrect.size >= Math.min(2, masteryTarget)) onComplete(skill?.id); }} className="btn-rise btn-primary px-7 py-3">Сабақты аяқтау</button>
                </div>
                {wrongAttempts.length > 0 && <div className="micro-card p-6">
                  <h2 className="text-2xl font-black mb-4">Қателер</h2>
                  <div className="space-y-3">
                    {wrongAttempts.slice(-4).reverse().map((item, idx) => <div key={`${item.id}-${idx}`} className="rounded-2xl border border-red-100 bg-red-50 p-4"><div className="font-black text-red-800"><MathText value={item.q} /></div><div className="mt-2 text-sm font-semibold text-red-700">Сіздің жауап: {item.answer || '—'} · Күтілетін: <MathText value={item.expected} /></div></div>)}
                  </div>
                </div>}
              </div>}
            </div>
          </main>
        </div>;
      }

      function TheoryPage({ grade }) {
        const lessons = THEORY_BANK[grade] || THEORY_BANK[String(grade)] || [];
        return <div className="p-8 lg:p-10 max-w-[1000px] mx-auto">
          <h1 className="text-4xl font-black mb-3">Теория кітапханасы</h1>
          <p className="font-semibold text-[var(--muted)] mb-7">{grade}-сынып бойынша барлық негізгі анықтамалар, формулалар және қадамдық мысалдар.</p>
          <div className="space-y-6">
            {lessons.map((lesson) => <div key={lesson.id} className="skill-card p-6">
              <div className="flex items-start justify-between gap-4 mb-4">
                <div>
                  <h2 className="text-2xl font-black mb-2">{lesson.title}</h2>
                  <p className="font-semibold text-[var(--muted)] leading-7">{lesson.summary}</p>
                </div>
                <span className="pill shrink-0">{grade}-сынып</span>
              </div>
              <div className="grid gap-4">
                {(lesson.sections || []).slice(0, 3).map((section, idx) => <TheorySectionCard key={idx} section={section} />)}
              </div>
            </div>)}
          </div>
        </div>;
      }

      function loadJSON(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch { return fallback; }
      }
      function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
      function getSkillAnswerHistory(skillId) { return loadJSON(`aqylai_answer_history_${skillId}`, []); }
      function getWrongAttempts(skillId) { return getSkillAnswerHistory(skillId).filter(item => item && item.correct === false); }
      function getWeakSkills(grade, completed) {
        return flattenSkills(grade)
          .map((skill, index) => ({ skill, wrong: getWrongAttempts(skill.id).length, index }))
          .filter(item => item.wrong > 0 || !completed?.[item.skill.id])
          .sort((a,b) => (b.wrong - a.wrong) || (completed?.[a.skill.id] ? 1 : -1) || (a.index - b.index))
          .slice(0, 6);
      }
      function getBookmarks() { return loadJSON('aqylai_bookmarks', []); }
      function setBookmarks(list) { saveJSON('aqylai_bookmarks', list); }
      function getNote(skillId) { return localStorage.getItem(`aqylai_note_${skillId}`) || ''; }
      function setNote(skillId, value) { localStorage.setItem(`aqylai_note_${skillId}`, value); }

      function ProgressPage({ grade, completed }) {
        const skills = flattenSkills(grade);
        const done = skills.filter(s=>completed?.[s.id]).length;
        const percent = skills.length ? Math.round(done/skills.length*100) : 0;
        const weak = getWeakSkills(grade, completed);
        return <div className="p-8 lg:p-10 max-w-[1040px] mx-auto">
          <h1 className="text-4xl font-black mb-3">Прогресс</h1>

          <div className="grid md:grid-cols-4 gap-5 mb-7">
            {[[percent+'%','Курс прогресі'],[done,'Аяқталған дағды'],[weak.length,'Қайталау керек'],[done>2?'74%':'68%','ZPD индекс']].map(x=><div key={x[1]} className="skill-card p-6"><div className="text-sm font-black text-[var(--muted)] mb-2">{x[1]}</div><div className="text-4xl font-black text-[var(--sage)]">{x[0]}</div></div>)}
          </div>
          <div className="grid lg:grid-cols-[1fr_.8fr] gap-6">
            <div className="skill-card p-6"><h2 className="text-2xl font-black mb-5">Дағдылар бойынша</h2>{skills.map((s,i)=>{const val=completed?.[s.id]?100:[65,45,25,15][i%4]; return <div key={s.id} className="mb-5"><div className="flex justify-between font-bold mb-2"><span>{s.title}</span><span>{val}%</span></div><div className="progress-track"><div style={{width:`${val}%`}}/></div></div>})}</div>
            <div className="skill-card p-6"><h2 className="text-2xl font-black mb-5">AI ұсынысы</h2><div className="space-y-3">{weak.slice(0,5).map(({skill, wrong})=><div key={skill.id} className="rounded-2xl border border-[var(--line)] p-4"><div className="font-black">{skill.title}</div><div className="text-sm font-semibold text-[var(--muted)] mt-1">{wrong ? `${wrong} қате жауап` : 'әлі толық аяқталмаған'}</div></div>)}</div></div>
          </div>
        </div>;
      }

      function ReviewPage({ grade, completed, setActiveSkill, setPage }) {
        const weak = getWeakSkills(grade, completed);
        const openSkill = (skill) => { const unit = COURSE_DATA[grade].find(u=>u.skills.some(s=>s.id===skill.id)); setActiveSkill({...skill, unit: unit?.unit || skill.unit, unitAbout: unit?.about || ''}); setPage('lesson'); };
        return <div className="p-8 lg:p-10 max-w-[980px] mx-auto">
          <div className="mb-7"><div className="text-sm font-black uppercase tracking-wide text-[var(--sage)] mb-2">Personal review</div><h1 className="text-4xl font-black tracking-[-.04em] mb-3">Қайталау жоспары</h1><p className="font-semibold text-[var(--muted)] leading-7">Мұнда қате болған немесе әлі аяқталмаған тақырыптар жиналады. Бұл ойын емес — нақты оқу диагностикасы.</p></div>
          <div className="space-y-4">
            {weak.map(({skill, wrong}) => <div key={skill.id} className="skill-card p-5 flex flex-col md:flex-row md:items-center gap-4">
              <div className="flex-1"><div className="text-sm font-black text-[var(--sage)] mb-1">{skill.unit}</div><h2 className="text-2xl font-black">{skill.title}</h2><p className="font-semibold text-[var(--muted)] mt-1">{wrong ? `${wrong} қате әрекет табылды. Қысқа теорияны қарап, 3 есеп шешіңіз.` : 'Тақырып әлі аяқталмаған.'}</p></div>
              <button onClick={()=>openSkill(skill)} className="btn-rise btn-primary px-7 py-3">Қайталау</button>
            </div>)}
            {!weak.length && <div className="soft-callout p-7 font-black text-[var(--sage-dark)]">Қазір қайталау тізімі бос. Барлық тақырып жақсы көрінеді.</div>}
          </div>
        </div>;
      }

      function NotesPage({ grade, setActiveSkill, setPage }) {
        const bookmarks = getBookmarks().filter(b => Number(b.grade) === Number(grade));
        const skills = flattenSkills(grade);
        const noted = skills.map(skill => ({ skill, note: getNote(skill.id) })).filter(x => x.note.trim());
        const openSkill = (skill) => { const unit = COURSE_DATA[grade].find(u=>u.skills.some(s=>s.id===skill.id)); setActiveSkill({...skill, unit: unit?.unit || skill.unit, unitAbout: unit?.about || ''}); setPage('lesson'); };
        return <div className="p-8 lg:p-10 max-w-[980px] mx-auto">
          <h1 className="text-4xl font-black mb-3">Блокнот және сақталған тақырыптар</h1>
          <p className="font-semibold text-[var(--muted)] mb-7">Маңызды тақырыптарды сақтап, жеке ескертпелер жазыңыз.</p>
          <div className="grid lg:grid-cols-2 gap-6">
            <div className="skill-card p-6"><h2 className="text-2xl font-black mb-4">Сақталғандар</h2><div className="space-y-3">{bookmarks.map(b=>{const skill=skills.find(s=>s.id===b.id) || b; return <button key={b.id} onClick={()=>openSkill(skill)} className="w-full text-left rounded-2xl border border-[var(--line)] p-4 hover:bg-[#f4f8f5]"><div className="font-black">{b.title}</div><div className="text-sm font-semibold text-[var(--muted)]">{b.unit || `${b.grade}-сынып`}</div></button>})}{!bookmarks.length && <div className="font-semibold text-[var(--muted)]">Әлі сақталған тақырып жоқ.</div>}</div></div>
            <div className="skill-card p-6"><h2 className="text-2xl font-black mb-4">Ескертпелер</h2><div className="space-y-3">{noted.map(({skill,note})=><button key={skill.id} onClick={()=>openSkill(skill)} className="w-full text-left rounded-2xl border border-[var(--line)] p-4 hover:bg-[#f4f8f5]"><div className="font-black">{skill.title}</div><div className="text-sm font-semibold text-[var(--muted)] mt-1 line-clamp-2">{note}</div></button>)}{!noted.length && <div className="font-semibold text-[var(--muted)]">Ескертпе жазылмаған.</div>}</div></div>
          </div>
        </div>;
      }

      function ProfilePage({ user, onLogout, completed, grade }) {
        const skills = flattenSkills(grade);
        const done=skills.filter(s=>completed?.[s.id]).length;
        const percent = skills.length ? Math.round(done/skills.length*100) : 0;
        const bookmarks = getBookmarks().filter(b=>Number(b.grade)===Number(grade)).length;
        return <div className="p-8 lg:p-10 max-w-[980px] mx-auto"><h1 className="text-4xl font-black mb-7">Жеке кабинет</h1><div className="skill-card p-7 flex flex-col md:flex-row gap-6 mb-6"><div className="w-24 h-24 rounded-3xl bg-[var(--sage)] text-white grid place-items-center text-4xl font-black">{user.name.slice(0,1).toUpperCase()}</div><div className="flex-1"><h2 className="text-3xl font-black">{user.name}</h2><p className="font-semibold text-[var(--muted)] mb-5">{grade}-сынып · {user.email}</p><div className="grid sm:grid-cols-4 gap-4">{[['Аяқталған сабақ',done],['Курс',percent+'%'],['Сақталған',bookmarks],['XP',user.xp || 0]].map(x=><div key={x[0]} className="rounded-2xl border border-[var(--line)] p-4"><div className="text-sm text-[var(--muted)] font-bold">{x[0]}</div><div className="text-2xl font-black">{x[1]}</div></div>)}</div><button onClick={onLogout} className="btn-rise btn-secondary px-8 py-3 mt-6">Шығу</button></div></div><div className="soft-callout p-6"><h2 className="text-2xl font-black mb-2">AI қорытынды</h2><p className="font-semibold text-[var(--muted)] leading-7">{done > 2 ? 'Сіз негізгі дағдыларды тұрақты меңгеріп жатырсыз. Енді күрделі деңгейдегі жаттығуларды көбейтіңіз.' : 'Алдымен 1–2 базалық тақырыпты аяқтаңыз. Жүйе содан кейін қайталау жоспарын нақтырақ құрады.'}</p></div></div>;
      }

      function MobileBottomNav({ setPage, page }) {
        return <nav className="mobile-bottom-nav">
          {['course','theory','review','progress','profile'].map(p=><button key={p} onClick={()=>setPage(p)} className={page===p?'active':''}>{p==='course'?'Курс':p==='theory'?'Теория':p==='review'?'Қайталау':p==='progress'?'Прогресс':'Профиль'}</button>)}
        </nav>;
      }

      function AcademyApp({ user, onLogout }) {
        const [grade, setGrade] = useState(user.grade || 8);
        const [page, setPage] = useState('course');
        const [search, setSearch] = useState('');
        const [completed, setCompleted] = useState(() => { try { return JSON.parse(localStorage.getItem('aqylai_completed') || '{}'); } catch { return {}; } });
        const [currentUser, setCurrentUser] = useState(user);
        const [activeSkill, setActiveSkill] = useState(() => flattenSkills(user.grade || 8).find(s=>s.status==='active') || flattenSkills(user.grade || 8)[0]);
        useEffect(()=>{ localStorage.setItem('aqylai_completed', JSON.stringify(completed)); }, [completed]);
        useEffect(()=>{ localStorage.setItem('aqylai_user', JSON.stringify(currentUser)); }, [currentUser]);
        const onGradeChange = (g) => { setGrade(g); localStorage.setItem('aqylai_grade', String(g)); const next = flattenSkills(g).find(s=>s.status==='active') || flattenSkills(g)[0]; setActiveSkill(next); setPage('course'); setSearch(''); };
        const onComplete = (skillId) => { if (!skillId || completed[skillId]) return; setCompleted(prev=>({...prev,[skillId]:true})); setCurrentUser(prev=>({...prev, xp:(prev.xp||0)+10 })); };
        return <div className="min-h-screen bg-white app-has-mobile-nav">
          <AppTopbar user={currentUser} onLogout={onLogout} setPage={setPage} search={search} setSearch={setSearch}/>
          <WorkspaceStrip user={currentUser} grade={grade} completed={completed}/>
          <div className="app-shell">
            <CourseNavigator grade={grade} setGrade={setGrade} activeSkill={activeSkill} setActiveSkill={setActiveSkill} setPage={setPage} completed={completed} search={search} onGradeChange={onGradeChange}/>
            <main className="main-workspace">
              {page==='course' && <CourseHome grade={grade} setActiveSkill={setActiveSkill} setPage={setPage} completed={completed} search={search}/>} 
              {page==='lesson' && <LessonWorkspace skill={activeSkill} onComplete={onComplete} completed={completed}/>} 
              {page==='theory' && <TheoryPage grade={grade}/>}
              {page==='progress' && <ProgressPage grade={grade} completed={completed}/>} 
              {page==='review' && <ReviewPage grade={grade} completed={completed} setActiveSkill={setActiveSkill} setPage={setPage}/>} 
              {page==='notes' && <NotesPage grade={grade} setActiveSkill={setActiveSkill} setPage={setPage}/>} 
              {page==='profile' && <ProfilePage user={currentUser} onLogout={onLogout} completed={completed} grade={grade}/>} 
            </main>

          </div>
          <MobileBottomNav setPage={setPage} page={page}/>
        </div>;
      }


      function App() {
        const [modalOpen, setModalOpen] = useState(false);
        const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('aqylai_user') || 'null'); } catch { return null; } });
        const demoLogin = () => { const demo = { name:'Demo оқушы', email:'demo@aqyl.ai', grade:8, goal:'school', xp:120, streak:0, level:1 }; localStorage.setItem('aqylai_user', JSON.stringify(demo)); localStorage.setItem('aqylai_current_user', demo.name); localStorage.setItem('aqylai_grade', String(demo.grade)); setUser(demo); };
        const logout = () => { localStorage.removeItem('aqylai_user'); localStorage.removeItem('aqylai_current_user'); setUser(null); };
        return <>{user ? <AcademyApp user={user} onLogout={logout}/> : <LandingPage onStart={()=>setModalOpen(true)} onLogin={demoLogin}/>}<OnboardingModal open={modalOpen} onClose={()=>setModalOpen(false)} onComplete={(u)=>{setUser(u); setModalOpen(false);}}/></>;
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
